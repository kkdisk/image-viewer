[package]
name = "image-viewer-rs"
version = "2.3.1"
edition = "2024"
description = "Rust 加速擴充模組 for Image Viewer"


[lib]
name = "image_viewer_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }
rayon = "1.10"
md-5 = "0.10"
digest = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
